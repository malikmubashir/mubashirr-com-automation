image_briefs:
- shot: hero
  prompt: A wide shallow ceramic bowl containing four glistening trout fillets skin-side
    down in a golden-amber coconut milk sauce speckled with black mustard seeds and
    dark green curry leaves. Garnished with fresh coriander and thin green chilli
    slices. Soft natural side-lighting on a pale linen surface. Food photography,
    editorial style.
  alt: Trout coconut curry with mustard seeds and curry leaves in a shallow ceramic
    bowl
- shot: ingredients
  prompt: Flat lay of rainbow trout fillets on parchment, a small tin of coconut milk,
    a bowl of black mustard seeds, a bunch of fresh curry leaves on the stem, green
    chillies, garlic, ginger, and a small jar of Dijon mustard on a light grey stone
    surface.
  alt: Ingredients for trout coconut curry including fresh curry leaves, mustard seeds,
    and coconut milk
- shot: process
  prompt: A cast iron skillet on a gas flame. Black mustard seeds are popping in hot
    oil, curry leaves curling and sizzling around the edges. The oil is golden and
    slightly hazy. Close-up, slightly dramatic light from above, motion blur on a
    single popping seed.
  alt: Black mustard seeds and curry leaves blooming in hot oil for the trout coconut
    curry base
- shot: plated
  prompt: A single trout fillet, skin-side down, resting in a pool of golden coconut
    mustard sauce on a wide white rimmed plate. A few crisp-fried curry leaves on
    top, a wedge of lime on the side, white basmati rice visible at the edge of the
    frame. Warm evening light.
  alt: Plated trout coconut curry fillet with coconut mustard sauce and crisp curry
    leaves
