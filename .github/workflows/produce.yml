name: produce

# One job, one trigger, one commit.
#
# Runs every weekday morning. It keeps STOCK_TARGET future Saturdays covered
# by complete, verified drafts (manifest.json). If stock is full it exits in
# seconds. Otherwise it produces exactly one draft, start to finish, in this
# single run (scout -> writer -> visual -> validate -> manifest) and commits
# it atomically. A failure anywhere commits nothing and the next weekday
# run retries. Five attempts per week replace the old one-shot cron chain.
#
# Publishing is NOT done here (the host blocks GitHub egress). The daily
# delivery task reads drafts/index.json + manifest.json and pushes complete
# drafts into WordPress via REST.

on:
  schedule:
    - cron: "15 5 * * 1-5"   # 05:15 UTC Mon-Fri. Time of day does not matter any more.
  workflow_dispatch:
    inputs:
      draft_date:
        description: "Produce this exact Saturday (YYYY-MM-DD). Empty = earliest gap in the horizon."
        required: false
        default: ""
      force:
        description: "Redo every step even if outputs exist (re-write text, re-generate images)."
        type: boolean
        required: false
        default: false
      stock_target:
        description: "How many future Saturdays to keep in stock."
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: produce one draft if stock is below target
        id: produce
        run: python -m pipeline.produce
        env:
          STOCK_TARGET: ${{ github.event.inputs.stock_target || '2' }}
          DRAFT_DATE: ${{ github.event.inputs.draft_date }}
          FORCE: ${{ github.event.inputs.force }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-6
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          EDAMAM_APP_ID: ${{ secrets.EDAMAM_APP_ID }}
          EDAMAM_APP_KEY: ${{ secrets.EDAMAM_APP_KEY }}
          WP_SKIP_UPLOAD: "true"

      - name: commit (only reached when every step above succeeded)
        run: |
          git config user.email "bot@mubashirr.com"
          git config user.name "mubashirr-bot"
          git add drafts/
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          if [ -n "${{ steps.produce.outputs.produced }}" ]; then
            msg="produce: ${{ steps.produce.outputs.produced }} ${{ steps.produce.outputs.slug }}"
          else
            msg="produce: refresh drafts/index.json"
          fi
          git commit -m "$msg"
          git pull --rebase
          git push

      - name: summary
        if: always()
        run: python -m pipeline.produce --summary >> "$GITHUB_STEP_SUMMARY"
